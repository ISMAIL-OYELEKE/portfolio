<text x="40" y="90" text-anchor="start" font-family="'Amazon Ember', 'Helvetica Neue', Arial, sans-serif"><tspan x="40" dy="0" font-weight="400" fill="#545b64" font-size="16">A chatbot on the portfolio that answers recruiter questions, built on Amazon Lex V2 and AWS Lambda, inside the AWS Free Tier.</tspan></text>
