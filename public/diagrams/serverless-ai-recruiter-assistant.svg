<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1720 840" width="1720" height="840" role="img" aria-labelledby="t d">
<title id="t">Project 4: Serverless AI recruiter assistant</title>
<desc id="d">A visitor chats through a Kommunicate widget on the portfolio. The widget sends each message to an Amazon Lex V2 bot, which matches it to one of six intents with a 0.70 confidence threshold and a fallback. Lex calls a Python 3.9 Lambda function to build the answer. IAM roles give least-privilege access between Lex and Lambda, and each turn is logged in CloudWatch.</desc>
