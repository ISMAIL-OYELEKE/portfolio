name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # required for the OIDC token used to assume the AWS role

jobs:
  deploy:
    name: Build and deploy to S3 and CloudFront
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build
        env:
          PUBLIC_WEB3FORMS_KEY: ${{ secrets.PUBLIC_WEB3FORMS_KEY }}
          PUBLIC_GA_ID: ${{ vars.PUBLIC_GA_ID }}

      - name: Quality checks
        run: node scripts/qa.mjs

      # Short-lived credentials from GitHub's OIDC provider. No access keys
      # are stored in this repository.
      - name: Assume the AWS deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      # Fingerprinted assets get a long cache; HTML and the service files do not,
      # so a deploy is visible immediately.
      - name: Upload fingerprinted assets
        run: |
          aws s3 sync dist "s3://${{ secrets.AWS_S3_BUCKET }}" \
            --delete \
            --exclude "*.html" \
            --exclude "robots.txt" \
            --exclude "sitemap*.xml" \
            --exclude "site.webmanifest" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Upload HTML and service files
        run: |
          aws s3 sync dist "s3://${{ secrets.AWS_S3_BUCKET }}" \
            --delete \
            --exclude "*" \
            --include "*.html" \
            --include "robots.txt" \
            --include "sitemap*.xml" \
            --include "site.webmanifest" \
            --cache-control "public, max-age=0, must-revalidate"

      - name: Invalidate the CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"

      - name: Summary
        run: echo "Deployed ${{ github.sha }} to https://ismailoyeleke.com" >> "$GITHUB_STEP_SUMMARY"
